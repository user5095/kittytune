name: Custom Release

# Scheduled: merge the latest upstream release into this branch, build, then push the merge and publish.
# Manual run: rebuild the current branch (use after pushing your own changes).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: alan7383/kittytune

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Merge latest upstream release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP_TAG=$(gh api repos/$UPSTREAM/releases/latest --jq .tag_name)
          git remote add upstream https://github.com/$UPSTREAM.git
          git fetch upstream tag "$UP_TAG" --no-tags
          if git merge-base --is-ancestor "$UP_TAG" HEAD; then
            echo "new_upstream=false" >> $GITHUB_OUTPUT
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            PRE=$(git rev-parse HEAD)
            # strategies in order: plain merge, our lines win conflicts, upstream's lines win conflicts.
            # The first one that still compiles is kept; none compiles -> job fails, nothing is pushed.
            # (ponytail: a strategy that compiles can still drop a fork patch inside a conflicting hunk)
            ok=false
            for strat in "" "-X ours" "-X theirs"; do
              git reset -q --hard "$PRE"
              git merge --no-edit $strat "$UP_TAG" >/dev/null 2>&1 || continue
              # GITHUB_TOKEN can't push workflow-file changes: keep this fork's own workflows
              git checkout "$PRE" -- .github/workflows
              git ls-tree -r --name-only HEAD .github/workflows | while read -r f; do git cat-file -e "$PRE:$f" 2>/dev/null || git rm -qf "$f"; done
              git commit --amend --no-edit
              if ./gradlew compileDebugKotlin -q --console=plain; then echo "merge strategy: '${strat:-plain}'"; ok=true; break; fi
            done
            $ok || { echo "no merge strategy compiles, resolve by hand"; exit 1; }
            echo "new_upstream=true" >> $GITHUB_OUTPUT
          fi

      - name: Decide whether to build
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.sync.outputs.new_upstream }}" = "true" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "Nothing new upstream, skipping."
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute version (upstream.N)
        if: steps.gate.outputs.build == 'true'
        id: ver
        run: |
          F=app/build.gradle.kts; [ -f $F ] || F=app/build.gradle
          BASE=$(grep -oP 'versionName\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' $F | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' $F | head -1)
          N=$(( $(git tag -l "v$BASE.*" | wc -l) + 1 ))
          VERSION="$BASE.$N"
          sed -i -E "s/(versionName\s*=\s*)\"[^\"]*\"/\1\"$VERSION\"/; s/(versionCode\s*=\s*)[0-9]+/\1$(( CODE * 100 + N ))/" $F
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT

      - name: Setup Android NDK
        if: steps.gate.outputs.build == 'true'
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: Accept Android SDK Licenses
        if: steps.gate.outputs.build == 'true'
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode keystore
        if: steps.gate.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Build release APK
        if: steps.gate.outputs.build == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -x lintVitalRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Publish release
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the in-app update popup renders the release body, so reuse upstream's changelog for this base version
          printf 'Custom build based on upstream v%s.\n\n' "${{ steps.ver.outputs.base }}" > notes.md
          gh api repos/$UPSTREAM/releases/tags/v${{ steps.ver.outputs.base }} --jq .body >> notes.md || true
          # --repo is mandatory: the `upstream` remote added above makes gh target the original repo otherwise
          # publish the upstream merge only now that it is known to build
          if [ "${{ steps.sync.outputs.new_upstream }}" = "true" ]; then git push origin HEAD; fi
          gh release create "v${{ steps.ver.outputs.version }}" app/build/outputs/apk/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "KittyTune ${{ steps.ver.outputs.version }}" \
            --notes-file notes.md
